# YUCLAW resilience (2026-07-04, after the Jun-26 outage — docs/ops/resilience.md)
# Installed to /etc/sysctl.d/99-yuclaw-resilience.conf by
# services/install_root_resilience.sh.
#
# A kernel panic or oops must REBOOT the box (10s grace), never leave it
# hanging dark and unreachable.
kernel.panic = 10
kernel.panic_on_oops = 1
