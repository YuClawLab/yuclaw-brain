# YUCLAW resilience: arm the GB10's SBSA hardware watchdog (sbsa_gwdt,
# /dev/watchdog). Installed to /etc/systemd/system.conf.d/watchdog.conf by
# services/install_root_resilience.sh.
#
# systemd (PID 1) pets the watchdog every RuntimeWatchdogSec/2; if the kernel
# or PID 1 hangs hard, the hardware resets the box after 60s — self-rescue
# for true hangs no software path can recover from.
# Verify: systemctl show -p RuntimeWatchdogUSec   (expect 1min)
[Manager]
RuntimeWatchdogSec=60
