[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "yuclaw"
version = "5.2.0"
description = "Evidence-first financial research — every signal traced to its SEC filings and verifiable against a public, git-anchored ledger. CLI + REST + MCP + LangChain/LlamaIndex. Research / education only — not investment advice."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["finance", "research", "quant", "sec-filings", "evidence", "ai", "agents", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Core deps for the CLI (demo · why · memo · cascade · share · verify · keys).
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.0",
    "psycopg2-binary>=2.9",
    "pandas>=2.0",
    "click>=8.0",
    "requests>=2.28",
    "httpx>=0.27",        # v3.sources fetch layer (cascade pulls DB_DSN from it)
    "feedparser>=6.0",    # v3.sources.edgar_poll
    "tenacity>=8.0",      # v3.sources retry
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.20", "httpx>=0.27"]   # REST server
mcp = ["mcp>=1.0"]                                          # MCP stdio server
agents = ["langchain-core>=1.0", "llama-index-core>=0.11"] # LangChain / LlamaIndex wrappers

[project.scripts]
yuclaw = "v4.cli:main"

[project.urls]
Homepage = "https://github.com/YuClawLab/yuclaw-brain"
Documentation = "https://github.com/YuClawLab/yuclaw-brain/tree/main/docs"
Ledger = "https://github.com/YuClawLab/yuclaw-trust"

# v4 ships the v3 evidence pipeline + the v4 API/CLI + the yuclaw_py SDK (bundled
# from sdk/ so `pip install yuclaw` is self-contained). The legacy v2.x `yuclaw/`
# tree is intentionally NOT packaged.
[tool.hatch.build.targets.wheel]
packages = ["v3", "v4"]

[tool.hatch.build.targets.wheel.force-include]
"sdk/yuclaw_py" = "yuclaw_py"
# 5.1.0: the evidence-memo rail imports tools.check_language — ship it.
"tools/__init__.py" = "tools/__init__.py"
"tools/check_language.py" = "tools/check_language.py"
# 5.2: yuclaw intake-check mirrors the server intake rules client-side — ship it.
"tools/yuclaw_client_intake.py" = "tools/yuclaw_client_intake.py"
# Note: v4/demo/fixtures/*.json (the bundled zero-backend demo signal) are packaged
# automatically as data files under the v4 package — no force-include needed.

[tool.hatch.build.targets.sdist]
include = ["v3", "v4", "sdk/yuclaw_py", "README.md", "DISCLAIMER.md", "LICENSE", "NOTICE", "docs", "schemas"]
# Never ship the archived v2.x monolith (buy/sell vocab, retired anchoring framing)
# or the legacy clawhub stub in the published sdist. `exclude` wins over `include`.
exclude = ["archive", "clawhub", "**/__pycache__", "**/*.pyc"]
